<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Termi · Vitrine da medalha</title>
<!--
  Vitrine 3D da medalha do Termi (loja L1 e mala M1b), aberta numa WebView do app.
  Mesma cena do protótipo "Termi · Souvenir" (three.js 0.160, WebGL do Chrome do Android).
  Parâmetros: glb=colecao/medalhas/<arquivo>.glb (obrigatório), reduzir=1 (reduzir movimento).
  Avisa o app por postMessage: "pronto" quando a medalha aparece, "erro" se não carregar.
  Fundo transparente: a vitrine (luz, prateleira, sombra) é desenhada pelo app.
-->
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from './loaders/GLTFLoader.js';

const avisar = (m) => { try { window.ReactNativeWebView && window.ReactNativeWebView.postMessage(m); } catch (e) {} };
const params = new URLSearchParams(location.search);
const glb = params.get('glb') || '';
const reduzir = params.get('reduzir') === '1';
if (!/^colecao\/medalhas\/[\w.-]+\.glb$/.test(glb)) { avisar('erro'); throw new Error('glb inválido'); }

const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
// Estúdio escuro com poucas fontes fortes: o metal precisa de contraste no reflexo.
const env = new THREE.Scene();
const sg = new THREE.SphereGeometry(10, 48, 24), cs = [];
for (let i = 0; i < sg.attributes.position.count; i++) { const y = sg.attributes.position.getY(i) / 10; const v = y > 0 ? 0.14 + 0.3 * y * y : 0.10 + 0.06 * y; cs.push(v * 0.97, v * 0.99, v); }
sg.setAttribute('color', new THREE.Float32BufferAttribute(cs, 3));
env.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({vertexColors: true, side: THREE.BackSide})));
const grad = () => { const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d'), l = g.createLinearGradient(0, 0, 0, 256);
  l.addColorStop(0, '#fff'); l.addColorStop(0.45, '#9a9893'); l.addColorStop(1, '#111'); g.fillStyle = l; g.fillRect(0, 0, 4, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const box = (w, h, x, y, z, k, map) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({color: new THREE.Color(k, k, k * 1.02), map: map || null, side: THREE.DoubleSide})); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
box(8, 5, -2.5, 4.5, 5.5, 0.9);
box(6, 5, 0, 1.2, 8, 0.5, grad());
box(1.2, 6, 6, 0, -1, 4);
box(10, 6, 0, 7, 1, 0.8);
box(10, 4, 0, -6, 3, 0.45);
scene.environment = pm.fromScene(env, 0.02).texture;

// Câmera mais perto que no protótipo: a medalha ocupa quase todo o quadro da vitrine.
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50); cam.position.set(0, 0, 4.3);
const key = new THREE.DirectionalLight(0xffffff, 4.0); key.position.set(-3.2, 2.6, 1.4);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.003;
Object.assign(key.shadow.camera, {left: -1.3, right: 1.3, top: 1.3, bottom: -1.3, near: 0.5, far: 10});
scene.add(key);
const rim = new THREE.DirectionalLight(0xdfe8ff, 0.6); rim.position.set(3, -1, -2); scene.add(rim);
const pivot = new THREE.Group(); scene.add(pivot);
const size = () => { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); };
addEventListener('resize', size); size();

// Grão jateado procedural (sem UV): varia rugosidade e normal pela posição no objeto.
const frost = (mt) => { mt.onBeforeCompile = (sh) => {
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vOP;varying vec3 vON;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvOP=position;vON=normal;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
varying vec3 vOP;varying vec3 vON;
float h3(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}`)
  .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
float g1=vn(vOP*320.0),g2=vn(vOP*320.0+17.3),g3=vn(vOP*90.0+5.1);
roughnessFactor=clamp(roughnessFactor+(g1-0.5)*0.22+(g3-0.5)*0.08,0.05,1.0);
float wall=smoothstep(0.12,0.5,1.0-abs(normalize(vON).y));
roughnessFactor=mix(roughnessFactor,0.12,wall);`)
  .replace('#include <color_fragment>', `#include <color_fragment>
float wl=smoothstep(0.12,0.5,1.0-abs(normalize(vON).y));
diffuseColor.rgb*=mix(1.0,0.28,wl);`)
  .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
normal=normalize(normal+vec3(g1-0.5,g2-0.5,0.0)*0.06);`);
}; };
const prep = (m) => { m.rotation.x = Math.PI / 2;
  const bb = new THREE.Box3().setFromObject(m), c = bb.getCenter(new THREE.Vector3());
  m.position.sub(c); m.traverse((o) => { if (!o.isMesh) return; o.castShadow = o.receiveShadow = true; const mt = o.material;
    if (/acetinado/i.test(mt.name)) { mt.roughness = 0.24; mt.color.setRGB(0.92, 0.93, 0.94); frost(mt); }
    else { mt.roughness = 0.03; mt.color.setRGB(0.92, 0.93, 0.94); }
  }); return m; };

new GLTFLoader().load('/' + glb, (g) => { pivot.add(prep(g.scene)); renderer.render(scene, cam); requestAnimationFrame(() => avisar('pronto')); }, undefined, () => avisar('erro'));

const REST_YAW = -0.24, REST_PITCH = -0.2;
let yaw = REST_YAW, pitch = REST_PITCH, vy = 0, vp = 0, drag = false, lx = 0, ly = 0;
const t0 = performance.now();
addEventListener('pointerdown', (e) => { drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointermove', (e) => { if (!drag) return; const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
  yaw += dx * 0.012; pitch = Math.max(-0.7, Math.min(0.7, pitch + dy * 0.008)); vy = dx * 0.012; vp = 0; });
const up = () => { drag = false; if (reduzir) { yaw = Math.round(yaw / (2 * Math.PI)) * 2 * Math.PI + REST_YAW; pitch = REST_PITCH; vy = vp = 0; } };
addEventListener('pointerup', up); addEventListener('pointercancel', up);

// Parado: volta de frente (múltiplo de 2π mais próximo) com mola amortecida; balanço leve se não reduzir.
const loop = (t) => {
  if (!drag) {
    const target = Math.round(yaw / (2 * Math.PI)) * 2 * Math.PI + REST_YAW;
    vy += (target - yaw) * 0.06; vy *= 0.82; yaw += vy;
    vp += (REST_PITCH - pitch) * 0.08; vp *= 0.78; pitch += vp;
  }
  const idle = reduzir || drag ? 0 : Math.sin((t - t0) / 1400) * 0.06;
  pivot.rotation.set(pitch + idle * 0.4, yaw + idle, 0);
  renderer.render(scene, cam); requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
</script>
</body>
</html>
