name: Diagnóstico das rotas

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testar pelo Node
        run: node scripts/diag.mjs
        env:
          ADSBLOL_KEY: ${{ secrets.ADSBLOL_KEY }}

      - name: Testar pelo curl
        run: |
          curl -sS -i -X POST https://api.adsb.lol/api/0/routeset \
            -H 'content-type: application/json' \
            --data '{"planes":[{"callsign":"GLO1101","lat":-23,"lng":-46}]}' | head -c 1500
