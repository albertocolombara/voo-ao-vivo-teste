name: Catálogo da coleção

# Publica colecao/catalogo.json no R2 quando ele muda na main (ou à mão). O script recusa o arquivo
# se algum souvenir publicado antes sumir: a coleção do Termi só cresce (RN-16).
on:
  push:
    branches: [main]
    paths: ['colecao/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confere e publica
        run: node scripts/publicar-catalogo.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
