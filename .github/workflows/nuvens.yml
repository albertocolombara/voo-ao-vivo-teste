# Nuvens reais do mundo inteiro para a janela do Termi (NASA GIBS, VIIRS -> WebP -> Cloudflare R2).
# A cada 3 h. Aqui o agendamento do GitHub serve: um atraso de minutos (ou uma execução pulada)
# não muda nada para nuvens que o satélite atualiza duas vezes por dia em cada lugar.
# Os arquivos são sobrescritos (mesmos nomes): o espaço no R2 fica constante (~22 MB).
name: Nuvens

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

concurrency:
  group: nuvens
  cancel-in-progress: false

jobs:
  nuvens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nuvens
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy boto3
      - name: Gerar e enviar
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python nuvens/gerar.py --paralelo 8
