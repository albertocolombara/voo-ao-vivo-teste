name: Diagnóstico satélite (temporário)
on:
  push:
    branches: [diag/satelite]
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3 rasterio numpy pillow scipy opencv-python-headless
      - run: python diag/satelite.py
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f saida3 || true
          git commit -m "Prévias do diagnóstico [skip ci]"
          git push
