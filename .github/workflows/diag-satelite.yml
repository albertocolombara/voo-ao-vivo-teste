name: Diagnóstico satélite (temporário)
on:
  push:
    branches: [diag/satelite]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3 rasterio numpy pillow
      - run: python diag/satelite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amostras
          path: saida/
