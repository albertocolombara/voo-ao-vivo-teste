name: Diagnóstico satélite (temporário)
on:
  push:
    branches: [diag/satelite]
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3 rasterio numpy pillow
      - run: python diag/satelite.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f saida/*.jpg
          git commit -m "Prévias do diagnóstico [skip ci]"
          git push
